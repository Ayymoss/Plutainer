# One service block per supported game. Delete what you don't want.
#
# Every block is complete and independent — copy one into your own compose file
# and it works, provided the gamefiles path and port are right.
#
# Ports here are the per-game defaults where possible; where two servers would
# collide, the second is offset. One port per server.

services:

  # ---------------------------------------------------------------- Plutonium
  # T4 — World at War. Multiplayer.
  t4mp-1:
    image: ghcr.io/ayymoss/plutainer:latest
    container_name: t4mp-1
    restart: unless-stopped
    ports: ["28960:28960/udp"]
    volumes:
      - /opt/game-files/T4ServerFiles:/home/plutainer/gamefiles:ro
      - ./t4mp-1:/home/plutainer/app
    environment:
      PLUTAINER_GAME: t4mp
      PLUTAINER_CONFIG_FILE: server.cfg
      PLUTAINER_PORT: "28960"
      PLUTO_SERVER_KEY: ${T4MP_KEY}

  # T4 — World at War. Zombies runs on the sp binary.
  t4zm-1:
    image: ghcr.io/ayymoss/plutainer:latest
    container_name: t4zm-1
    restart: unless-stopped
    ports: ["28961:28961/udp"]
    volumes:
      - /opt/game-files/T4ServerFiles:/home/plutainer/gamefiles:ro
      - ./t4zm-1:/home/plutainer/app
    environment:
      PLUTAINER_GAME: t4sp
      PLUTAINER_CONFIG_FILE: server_zm.cfg
      PLUTAINER_PORT: "28961"
      PLUTO_SERVER_KEY: ${T4ZM_KEY}

  # T5 — Black Ops. Multiplayer.
  # NOTE: T5 needs a *valid* Plutonium key. A placeholder key leaves it stuck
  # in a map-rotation loop forever. See docs/games.md#t5-black-ops.
  t5mp-1:
    image: ghcr.io/ayymoss/plutainer:latest
    container_name: t5mp-1
    restart: unless-stopped
    ports: ["28962:28962/udp"]
    volumes:
      - /opt/game-files/T5ServerFiles:/home/plutainer/gamefiles:ro
      - ./t5mp-1:/home/plutainer/app
    environment:
      PLUTAINER_GAME: t5mp
      PLUTAINER_CONFIG_FILE: dedicated.cfg
      PLUTAINER_PORT: "28962"
      PLUTO_SERVER_KEY: ${T5MP_KEY}

  # T5 — Black Ops. Zombies runs on the sp binary.
  t5zm-1:
    image: ghcr.io/ayymoss/plutainer:latest
    container_name: t5zm-1
    restart: unless-stopped
    ports: ["28963:28963/udp"]
    volumes:
      - /opt/game-files/T5ServerFiles:/home/plutainer/gamefiles:ro
      - ./t5zm-1:/home/plutainer/app
    environment:
      PLUTAINER_GAME: t5sp
      PLUTAINER_CONFIG_FILE: dedicated_sp.cfg
      PLUTAINER_PORT: "28963"
      PLUTO_SERVER_KEY: ${T5ZM_KEY}
      # Mods are a path under the game files, e.g.:
      # PLUTAINER_MOD: mods/Stairway_to_hell_bo1

  # T6 — Black Ops II. Multiplayer.
  t6mp-1:
    image: ghcr.io/ayymoss/plutainer:latest
    container_name: t6mp-1
    restart: unless-stopped
    ports: ["4977:4977/udp"]
    volumes:
      - /opt/game-files/T6ServerFiles:/home/plutainer/gamefiles:ro
      - ./t6mp-1:/home/plutainer/app
    environment:
      PLUTAINER_GAME: t6mp
      PLUTAINER_CONFIG_FILE: dedicated.cfg
      PLUTAINER_PORT: "4977"
      PLUTO_SERVER_KEY: ${T6MP_KEY}

  # T6 — Black Ops II. Zombies.
  t6zm-1:
    image: ghcr.io/ayymoss/plutainer:latest
    container_name: t6zm-1
    restart: unless-stopped
    ports: ["4976:4976/udp"]
    volumes:
      - /opt/game-files/T6ServerFiles:/home/plutainer/gamefiles:ro
      - ./t6zm-1:/home/plutainer/app
    environment:
      PLUTAINER_GAME: t6zm
      PLUTAINER_CONFIG_FILE: dedicated_zm.cfg
      PLUTAINER_PORT: "4976"
      PLUTO_SERVER_KEY: ${T6ZM_KEY}

  # IW5 — Modern Warfare 3. Multiplayer only.
  iw5mp-1:
    image: ghcr.io/ayymoss/plutainer:latest
    container_name: iw5mp-1
    restart: unless-stopped
    ports: ["27016:27016/udp"]
    volumes:
      - /opt/game-files/IW5ServerFiles:/home/plutainer/gamefiles:ro
      - ./iw5mp-1:/home/plutainer/app
    environment:
      PLUTAINER_GAME: iw5mp
      PLUTAINER_CONFIG_FILE: server.cfg
      PLUTAINER_PORT: "27016"
      PLUTO_SERVER_KEY: ${IW5MP_KEY}

  # --------------------------------------------------------------------- IW4x
  # Modern Warfare 2. No server key. First start downloads 1-2 GB.
  # amd64 only — see docs/games.md#architecture-support.
  iw4x-1:
    image: ghcr.io/ayymoss/plutainer:latest
    container_name: iw4x-1
    restart: unless-stopped
    ports:
      - "28964:28964/udp"
      # TCP is only needed if you host mods (modlist metadata):
      # - "28964:28964/tcp"
    volumes:
      - /opt/game-files/IW4xServerFiles:/home/plutainer/gamefiles:ro
      - ./iw4x-1:/home/plutainer/app
    environment:
      PLUTAINER_GAME: iw4x
      PLUTAINER_CONFIG_FILE: server.cfg
      PLUTAINER_PORT: "28964"

  # ---------------------------------------------------------------- Alterware
  # T7x — Black Ops III. No server key.
  t7x-zm-1:
    image: ghcr.io/ayymoss/plutainer:latest
    container_name: t7x-zm-1
    restart: unless-stopped
    ports: ["27017:27017/udp"]
    volumes:
      - /opt/game-files/T7xServerFiles:/home/plutainer/gamefiles:ro
      - ./t7x-zm-1:/home/plutainer/app
    environment:
      PLUTAINER_GAME: t7x
      PLUTAINER_CONFIG_FILE: server_zm.cfg
      PLUTAINER_PORT: "27017"
      # On T7x, PLUTAINER_MOD is a Steam Workshop ID:
      # PLUTAINER_MOD: "2833912385"

  # -------------------------------------------------------------------- CoD4x
  # Modern Warfare. Multiplayer only, amd64 only. No Plutonium-style key, but
  # a masterserver token is what gets you into the server browser (below).
  # The gamefiles mount needs only main/ and zone/.
  cod4x-1:
    image: ghcr.io/ayymoss/plutainer:latest
    container_name: cod4x-1
    restart: unless-stopped
    ports: ["28965:28965/udp"]
    volumes:
      - /opt/game-files/IW3ServerFiles:/home/plutainer/gamefiles:ro
      - ./cod4x-1:/home/plutainer/app
    environment:
      PLUTAINER_GAME: cod4x
      PLUTAINER_CONFIG_FILE: server.cfg
      PLUTAINER_PORT: "28965"
      # Needed to appear in the server browser. The server runs without it,
      # but never registers with the master, so nobody finds it.
      # 32-character token from http://cod4master.cod4x.ovh
      # PLUTAINER_COD4X_AUTH_TOKEN: ${COD4X_TOKEN}

  # ------------------------------------------------------------- SteamCMD
  # These install themselves. No gamefiles mount, no Steam login, no key.
  # amd64 only. Budget the disk: CS2 ~67 GB, 7DTD ~17 GB, L4D2 ~9 GB, HL2:DM ~6 GB.

  # 7 Days to Die. Native Linux server (Unity), telnet console.
  7dtd-1:
    image: ghcr.io/ayymoss/plutainer:latest
    container_name: 7dtd-1
    restart: unless-stopped
    # The image stops with SIGKILL, which is right for the CoD engines but would
    # cost 7DTD its world save. Ask for SIGTERM and give it time to finish.
    # Docker still force-kills once the grace period expires.
    stop_signal: SIGTERM
    stop_grace_period: 90s
    ports:
      - "26900:26900/tcp"
      - "26900-26903:26900-26903/udp"
      # Telnet is RCON for 7DTD. Keep it private: leave the loopback default for
      # host-side tools, or set SEVENDTD_TELNET_BIND to a stable private host IP
      # that a containerized IW4MAdmin can reach. Never use a public bind here.
      - "${SEVENDTD_TELNET_BIND:-127.0.0.1}:8081:8081/tcp"
    volumes:
      - ./7dtd-1:/home/plutainer/app
    environment:
      PLUTAINER_GAME: 7dtd
      PLUTAINER_PORT: "26900"
      PLUTAINER_SERVER_NAME: My 7 Days to Die Server
      # Enables the telnet console and sets its password, so rcon-cli works.
      PLUTAINER_RCON_PASSWORD: ${SEVENDTD_RCON}
      # Optional Steam branch:
      # PLUTAINER_STEAM_BETA: latest_experimental

  # Counter-Strike 2. Source 2. ~67 GB installed — check your disk first.
  # First start will exceed the health grace period and show `unhealthy`
  # while it downloads; it recovers on its own.
  cs2-1:
    image: ghcr.io/ayymoss/plutainer:latest
    container_name: cs2-1
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    ports:
      - "27019:27019/udp"
      - "27019:27019/tcp"
    volumes:
      - ./cs2-1:/home/plutainer/app
    environment:
      PLUTAINER_GAME: cs2
      PLUTAINER_PORT: "27019"
      PLUTAINER_SERVER_NAME: My CS2 Server
      PLUTAINER_RCON_PASSWORD: ${CS2_RCON}
      # Needed to appear in the server browser. The server runs without it,
      # but nobody finds it. Get one at:
      # https://steamcommunity.com/dev/managegameservers
      PLUTAINER_CS2_GSLT: ${CS2_GSLT}
      # PLUTAINER_CS2_GAME_ALIAS: competitive
      # PLUTAINER_START_MAP: de_dust2

  # Left 4 Dead 2. Native Linux Source server, Valve RCON.
  # First start is slow: Valve only offers this app's content depot to Windows,
  # so Plutainer pulls it as Windows and then overlays the Linux binaries.
  # ~9.2 GB. See docs/games.md#the-source-games-l4d2-hl2dm.
  l4d2-1:
    image: ghcr.io/ayymoss/plutainer:latest
    container_name: l4d2-1
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    ports:
      - "27015:27015/udp"
      - "27015:27015/tcp"
    volumes:
      - ./l4d2-1:/home/plutainer/app
    environment:
      PLUTAINER_GAME: l4d2
      PLUTAINER_PORT: "27015"
      PLUTAINER_SERVER_NAME: My L4D2 Server
      PLUTAINER_RCON_PASSWORD: ${L4D2_RCON}
      # PLUTAINER_START_MAP: c2m1_highway

  # Half-Life 2: Deathmatch. Source dedicated server, Valve RCON.
  hl2dm-1:
    image: ghcr.io/ayymoss/plutainer:latest
    container_name: hl2dm-1
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    ports:
      - "27018:27018/udp"
      - "27018:27018/tcp"
    volumes:
      - ./hl2dm-1:/home/plutainer/app
    environment:
      PLUTAINER_GAME: hl2dm
      PLUTAINER_PORT: "27018"
      PLUTAINER_SERVER_NAME: My HL2DM Server
      PLUTAINER_RCON_PASSWORD: ${HL2DM_RCON}
      # PLUTAINER_MAX_CLIENTS: "16"
      # PLUTAINER_START_MAP: dm_lockdown

  # --------------------------------------------------------------- Nebula
  # Dyson Sphere Program. Supply the owned Windows game files; Plutainer
  # installs BepInEx, Nebula, its dependency graph, and the headless Steam API
  # compatibility layer. No Steam login is required.
  nebula-1:
    image: ghcr.io/ayymoss/plutainer:latest
    container_name: nebula-1
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 90s
    ports:
      - "8469:8469/tcp"
    volumes:
      - /opt/game-files/DysonSphereProgram:/home/plutainer/gamefiles:ro
      - ./nebula-1:/home/plutainer/app
    environment:
      PLUTAINER_GAME: nebula
      PLUTAINER_PORT: "8469"
      PLUTAINER_SERVER_NAME: My Nebula Server
      PLUTAINER_NEBULA_VERSION: ${NEBULA_VERSION:-latest}
      PLUTAINER_NEBULA_MODS: ${NEBULA_MODS:-}
      # PLUTAINER_NEBULA_SERVER_PASSWORD: ${NEBULA_SERVER_PASSWORD}
      # PLUTAINER_NEBULA_REMOTE_PASSWORD: ${NEBULA_REMOTE_PASSWORD}
      # PLUTAINER_NEBULA_SAVE: MySave
