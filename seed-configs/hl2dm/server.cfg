// Half-Life 2: Deathmatch dedicated server config, seeded by Plutainer on
// first start.
//
// This file is yours — edit it. Plutainer never overwrites it, and the game
// reads it through a symlink placed in the SteamCMD-managed install directory,
// so a Steam update cannot clobber it either.
//
// Unlike the Call of Duty seeds in this directory there is no upstream repo
// behind this one: Valve's dedicated server ships no server.cfg at all, so this
// is a minimal working default written for Plutainer. It applies unchanged to
// most other Source dedicated servers.

// Shown in the server browser. PLUTAINER_SERVER_NAME overwrites this line.
hostname "Half-Life 2: Deathmatch Server"

// Empty by default, deliberately. A shipped password is a known credential on a
// port anyone can find by scanning. Set PLUTAINER_RCON_PASSWORD to fill it in,
// or write one here yourself.
rcon_password ""

// Empty means the server is public. Set it to require a password to join.
sv_password ""

sv_region 255              // 255 = world. 3 = Europe, 0 = US East, etc.
sv_lan 0
sv_cheats 0
sv_consistency 1
sv_pure 0
sv_alltalk 0

mp_timelimit 20
mp_friendlyfire 0
mp_falldamage 0
mp_forcerespawn 1
mp_footsteps 1
mp_flashlight 1

// Logging. Plutainer's log watcher surfaces whatever lands under app/.
log on
sv_logbans 1
sv_logecho 0
sv_logfile 1
sv_log_onefile 0

// Rates. These are the stock dedicated-server values.
sv_minrate 30000
sv_maxrate 0
sv_mincmdrate 10
sv_maxcmdrate 66
sv_minupdaterate 10
sv_maxupdaterate 66
