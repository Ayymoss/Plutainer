; Insurgency: Sandstorm server settings, seeded by Plutainer on first start.
; Edit this copy in app/configs/. The server rewrites it from memory when it
; shuts down, so values you set are kept but these comments will not be.
; Settings reference: docs/games.md, "Insurgency: Sandstorm".

[Rcon]
; Off until a password is set. PLUTAINER_RCON_PASSWORD fills Password in and
; switches bEnabled on. There is deliberately no default password.
bEnabled=False
Password=
ListenPort=27015

[/Script/Insurgency.INSMultiplayerMode]
bMapVoting=True
bUseMapCycle=True
