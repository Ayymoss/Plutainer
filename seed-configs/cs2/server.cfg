// Counter-Strike 2 dedicated server config, seeded by Plutainer on first start.
//
// This file is yours — edit it. Plutainer never overwrites it, and the game
// reads it through a symlink placed in the SteamCMD-managed install directory
// (game/csgo/cfg/), so a Steam update cannot clobber it either.
//
// There is no upstream repo behind this one: Valve's dedicated server ships no
// server.cfg, so this is a minimal working default written for Plutainer.

// Shown in the server browser. PLUTAINER_SERVER_NAME overwrites this line.
hostname "Counter-Strike 2 Server"

// Empty by default, deliberately. A shipped password is a known credential on a
// port anyone can find by scanning. Set PLUTAINER_RCON_PASSWORD to fill it in.
//
// Note that Plutainer also passes the password on the command line, because CS2
// starts RCON before it execs this file.
rcon_password ""

// Empty means the server is public. Set it to require a password to join.
sv_password ""

// A Game Server Login Token from https://steamcommunity.com/dev/managegameservers
// is what puts the server in the public browser. Set PLUTAINER_CS2_GSLT instead
// of writing it here, so it stays out of the config file.
// sv_setsteamaccount ""

sv_lan 0
sv_cheats 0
sv_hibernate_when_empty 0
sv_region 255                  // 255 = world. 3 = Europe, 0 = US East, etc.

// Bots. bot_quota 0 disables them entirely.
bot_quota 0
bot_difficulty 1
bot_quota_mode fill

mp_autoteambalance 1
mp_limitteams 1
mp_friendlyfire 0
mp_autokick 0
mp_match_end_restart 1

// Logging. Plutainer's log watcher surfaces whatever lands under app/.
log on
sv_logfile 1
sv_logecho 0
sv_log_onefile 0
